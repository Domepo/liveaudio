services:
  postgres:
    image: ${POSTGRES_IMAGE:-timescale/timescaledb:2.17.2-pg16}
    container_name: livevoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: livevoice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livevoice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: livevoice-app
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_DB: livevoice
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      NODE_ENV: production
      RUNNING_IN_DOCKER: 1
      API_PORT: 3001
      API_HOST: 0.0.0.0
      WEB_PORT: 5173
      WEB_HOST: 0.0.0.0
      MEDIA_PORT: 4000
      MEDIA_LISTEN_IP: 0.0.0.0
      MEDIA_ANNOUNCED_IP: "${MEDIA_ANNOUNCED_IP:?MEDIA_ANNOUNCED_IP must be set to the public server IP}"
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 42000
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      JWT_ISSUER: liveaudio-api
      ADMIN_LOGIN_NAME: "${ADMIN_LOGIN_NAME:-admin}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      MEDIA_BASE_URL: http://127.0.0.1:4000
      MEDIA_INTERNAL_TOKEN: "${MEDIA_INTERNAL_TOKEN:?MEDIA_INTERNAL_TOKEN must be set}"
      JOIN_TOKEN_TTL_MINUTES: 15
      PIN_MAX_ATTEMPTS: 6
    ports:
      - "5173:5173"
      - "3001:3001"
      - "40000-42000:40000-42000/udp"
      - "40000-42000:40000-42000/tcp"
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
